name: CI

on:
  push:
    branches: [ concept, 'feat/**', 'chore/**', tim ]
  pull_request:
    branches: [ concept ]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install
        run: pnpm install

  lint:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Lint
        run: pnpm -w run lint || echo "No lint script configured"

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Test
        run: pnpm -w run test || echo "No test script configured"

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: E2E Smoke (placeholder)
        run: echo "Run E2E smoke tests (Antigravity/Playwright) - configure later"
