name: CI

on:
  push:
    branches: [ concept, 'feat/**', 'chore/**', tim ]
  pull_request:
    branches: [ concept ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      node-version: 18
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Enable corepack
        run: corepack enable
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

  install_and_test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Enable corepack
        run: corepack enable
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies (workspace)
        run: pnpm install
      - name: Run unit tests (shared)
        run: pnpm --filter ./packages/shared test
      - name: Run lint if available
        run: pnpm -w -r run lint || echo "No lint script configured"

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: install_and_test
    steps:
      - uses: actions/checkout@v4
      - name: E2E Smoke (placeholder)
        run: echo "Run E2E smoke tests (Antigravity/Playwright) - configure later"
